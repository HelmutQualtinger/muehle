<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mühle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Vollkorn:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>window.MUEHLE_GAME_ID = {{ game_id|tojson }};</script>
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>Mühle</h1>
      <div class="header__actions">
        <button id="mute-btn" class="icon-btn" type="button" aria-pressed="false" aria-label="Ton stumm schalten">🔊</button>
        {% if not game_id %}
        <button id="net-create-btn" class="btn btn--ghost" type="button">🌐 Online spielen</button>
        {% endif %}
        <button id="new-game-btn" class="btn">{{ "Neues Spiel (Revanche)" if game_id else "Neues Spiel" }}</button>
      </div>
    </header>

    {% if not game_id %}
    <div class="settings" id="local-settings">
      <div class="settings__group" role="radiogroup" aria-label="Gegner">
        <button type="button" class="chip is-active" data-opponent="human">2 Spieler</button>
        <button type="button" class="chip" data-opponent="computer">Gegen Computer</button>
      </div>
      <div class="settings__group settings__group--color" role="radiogroup" aria-label="Farbe wählen" hidden>
        <button type="button" class="chip is-active" data-color="white">Weiss spielen</button>
        <button type="button" class="chip" data-color="black">Schwarz spielen</button>
      </div>
    </div>
    {% endif %}

    {% if game_id %}
    <div class="network-panel" id="network-panel">
      <p>Du spielst als <strong id="net-your-color">…</strong>. Einladungslink für deine Mitspielerin/deinen Mitspieler:</p>
      <div class="invite">
        <input id="invite-link-input" type="text" readonly aria-label="Einladungslink">
        <button id="copy-link-btn" class="btn btn--small" type="button">Link kopieren</button>
        <a id="mail-invite-btn" class="btn btn--small" href="#">Per E-Mail einladen</a>
      </div>
    </div>
    {% endif %}

    <p id="status" class="status" aria-live="polite">Lädt…</p>

    <div class="table">
      <section class="player player--black">
        <span class="player__label">Schwarz</span>
        <div class="stock" id="stock-black" aria-label="Schwarz: Steine zum Setzen"></div>
      </section>

      <div class="board-wrap">
        <svg id="board" viewBox="-0.8 -0.8 7.6 7.6" role="img" aria-label="Mühle-Spielbrett"></svg>
      </div>

      <section class="player player--white">
        <span class="player__label">Weiss</span>
        <div class="stock" id="stock-white" aria-label="Weiss: Steine zum Setzen"></div>
      </section>
    </div>
  </main>

  <script src="{{ url_for('static', filename='js/game.js') }}"></script>
</body>
</html>
